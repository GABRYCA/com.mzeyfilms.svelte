services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into SvelteKit's paths.origin at build time.
        ORIGIN: ${ORIGIN:-https://mzeyfilms.com}
    environment:
      # SvelteKit & Runtime
      NODE_ENV: production
      ORIGIN: ${ORIGIN:-https://mzeyfilms.com}
      # adapter-bun defaults to 512K; admin uploads need 15 MB.
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-15728640}

      # Embedded PocketBase Settings
      POCKETBASE_EMBEDDED: "true"
      POCKETBASE_INTERNAL_URL: "http://127.0.0.1:8090"
      PUBLIC_POCKETBASE_URL: "/pb"

      # Coolify Traefik routing variable
      SERVICE_FQDN_WEBSITE_3000: ${SERVICE_FQDN_WEBSITE_3000:-https://mzeyfilms.com}

      # Optional image services (only used if with --profile images)
      IMAGE_PROXY_INTERNAL_URL: ${IMAGE_PROXY_INTERNAL_URL:-}
      IMAGE_PROXY_LOCAL_ORIGIN: ${IMAGE_PROXY_LOCAL_ORIGIN:-http://website:3000}
    expose:
      - "3000"
    volumes:
      - pocketbase_data:/app/pb_data
    restart: unless-stopped

  # Optional image optimization stack.
  image-transformer:
    profiles: ["images"]
    image: ghcr.io/coollabsio/next-image-transformation:latest
    environment:
      ALLOWED_REMOTE_DOMAINS: website,${IMAGE_PROXY_ALLOWED_REMOTE_DOMAINS:-}
      IMGPROXY_URL: http://imgproxy:8080
    depends_on:
      imgproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  imgproxy:
    profiles: ["images"]
    image: ghcr.io/imgproxy/imgproxy:latest
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_JPEG_PROGRESSIVE: "true"
      IMGPROXY_USE_ETAG: "true"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pocketbase_data:
    name: mzeyfilms_pocketbase_data